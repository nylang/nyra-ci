name: Qualify private native SDK candidates
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Native qualification, or target work reusing accepted native archives
        type: choice
        options: [native, targets, admit]
        default: native
        required: true
      tag:
        description: Reviewed release plan required by the targets phase
        type: string
        required: false
      source_ref:
        description: Trusted private source branch, tag, or commit (resolved once)
        type: string
        default: main
        required: true
      hosts:
        description: Optional native/target host subset; empty selects all four
        type: string
        default: ''
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: sdk-source-build
  cancel-in-progress: false
jobs:
  prepare:
    if: inputs.phase == 'native'
    runs-on: [self-hosted, macOS, ARM64, nyra-sdk, nyra-macos-arm64]
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: source
        env:
          NYRA_CI_SOURCE_REF: ${{ inputs.source_ref }}
          NYRA_CI_HOSTS: ${{ inputs.hosts }}
        run: python3 -B scripts/prepare_source.py
  build:
    if: inputs.phase == 'native'
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 720
    concurrency:
      group: native-build-${{ startsWith(matrix.host, 'darwin-') && 'shared-mac' || matrix.host }}
      cancel-in-progress: false
    env:
      NYRA_CI_SOURCE_REF: ${{ needs.prepare.outputs.source_commit }}
      NYRA_CI_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Qualify compiler and tools once (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -B scripts/build_sdk.py
      - name: Qualify compiler and tools once (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python -B scripts/build_sdk.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-sdk-${{ matrix.host }}
          path: public-output/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: build-receipt-${{ matrix.host }}
          path: build-receipt.json
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: private-qualification-${{ matrix.host }}
          path: qualification-evidence/
          retention-days: 30
      - name: Release completed candidate build scratch (Unix)
        if: success() && runner.os != 'Windows'
        shell: bash
        run: python3 -B scripts/retain_assembly.py
      - name: Release completed candidate build scratch (Windows)
        if: success() && runner.os == 'Windows'
        shell: cmd
        run: python -B scripts/retain_assembly.py
  targets:
    if: inputs.phase == 'targets'
    uses: ./.github/workflows/qualify-retained.yml
    with:
      tag: ${{ inputs.tag }}
      hosts: ${{ inputs.hosts }}
  admission:
    if: inputs.phase == 'admit'
    uses: ./.github/workflows/admit-native.yml
    with:
      tag: ${{ inputs.tag }}
