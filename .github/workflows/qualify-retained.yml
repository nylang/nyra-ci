name: Complete retained SDK target qualification
on:
  workflow_call:
    inputs:
      tag:
        description: Frozen release plan with reviewed qualified-inputs pins
        type: string
        required: true
      hosts:
        description: Optional host subset; partial runs retain target outputs without assembly
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  NYRA_CI_RELEASE_TAG: ${{ inputs.tag }}
jobs:
  prepare:
    runs-on: [self-hosted, macOS, ARM64, nyra-sdk, nyra-macos-arm64]
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: inputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NYRA_CI_HOSTS: ${{ inputs.hosts }}
        run: python3 -B scripts/retained_targets.py --plan
  targets:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 240
    concurrency:
      group: native-build-${{ startsWith(matrix.host, 'darwin-') && 'shared-mac' || matrix.host }}
      cancel-in-progress: false
    env:
      NYRA_CI_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: matrix.native_run != ''
        with:
          name: public-sdk-${{ matrix.host }}
          path: native-input/
          run-id: ${{ matrix.native_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and qualify assigned targets from accepted native bytes (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -B scripts/retained_targets.py
      - name: Build and qualify assigned targets from accepted native bytes (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python -B scripts/retained_targets.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-catalog-${{ matrix.host }}
          path: runtime-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-sdk-${{ matrix.host }}
          path: public-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: target-receipt-${{ matrix.host }}
          path: |
            build-receipt.json
            qualification-evidence/
          retention-days: 30
      - name: Retain assembly inputs and release completed target scratch (Unix)
        if: success() && runner.os != 'Windows'
        shell: bash
        run: python3 -B scripts/retain_assembly.py
      - name: Release completed target scratch (Windows)
        if: success() && runner.os == 'Windows'
        shell: cmd
        run: python -B scripts/retain_assembly.py
  assemble:
    if: inputs.hosts == ''
    name: Assemble retained publication bundle
    needs: targets
    runs-on: [self-hosted, macOS, ARM64, nyra-sdk, nyra-macos-arm64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare owned assembly storage and preserve filesystem reserve
        run: python3 -B scripts/assembly_storage.py
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: runtime-catalog-*
          path: catalog-input/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: public-sdk-*
          path: publish-input/
          merge-multiple: true
      - name: Assemble and verify exact accepted SDK/runtime assets
        run: |
          python3 -B scripts/release_package.py
          python3 -B scripts/publish_bundle.py --directory publish-input --tag "$NYRA_CI_RELEASE_TAG" --qualification-run "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qualified-release
          path: publish-input/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
