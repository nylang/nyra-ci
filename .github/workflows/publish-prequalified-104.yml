name: Publish prequalified 1.0.4 (no rebuild)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-v1.0.4
  cancel-in-progress: false
jobs:
  transfer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: darwin-arm64
            labels: [self-hosted, macOS, ARM64, nyra-sdk, nyra-macos-arm64]
          - host: darwin-x86_64
            labels: [self-hosted, macOS, X64, nyra-sdk, nyra-macos-x86_64]
          - host: linux-x86_64
            labels: [self-hosted, Linux, X64, nyra-sdk, nyra-linux-x64]
          - host: windows-x86_64
            labels: [self-hosted, Windows, X64, nyra-sdk, nyra-windows-x64]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 90
    env:
      NYRA_CI_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: unix
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -B scripts/publish_prequalified.py --stage
      - id: windows
        if: runner.os == 'Windows'
        shell: cmd
        run: python -B scripts/publish_prequalified.py --stage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prequalified-${{ matrix.host }}
          path: ${{ steps.unix.outputs.directory || steps.windows.outputs.directory }}
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: transfer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: prequalified-*
          path: publish-input/
          merge-multiple: true
      - name: Publish frozen accepted assets; no source build or suites
        env:
          SDK_RELEASE_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN }}
        run: python3 -B scripts/publish_prequalified.py --directory publish-input
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: publication-receipt
          path: publication.json
          retention-days: 30
