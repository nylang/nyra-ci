name: Qualify and release SDK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release plan tag (releases/vX.Y.Z.json)
        type: string
        required: true
      publish:
        description: Publish the exact qualified bundle after all gates pass
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: sdk-source-build
  cancel-in-progress: false
env:
  NYRA_CI_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  prepare:
    runs-on: [self-hosted, macOS, ARM64, nyra-sdk, nyra-macos-arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate immutable source and publication destination
        env:
          SDK_RELEASE_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN }}
        run: python3 -B scripts/release_prepare.py
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: darwin-arm64
            labels: [self-hosted, macOS, ARM64, nyra-sdk, nyra-macos-arm64]
          - host: darwin-x86_64
            labels: [self-hosted, macOS, X64, nyra-sdk, nyra-macos-x86_64]
          - host: linux-x86_64
            labels: [self-hosted, Linux, X64, nyra-sdk, nyra-linux-x64]
          - host: windows-x86_64
            labels: [self-hosted, Windows, X64, nyra-sdk, nyra-windows-x64]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 720
    concurrency:
      group: native-build-${{ startsWith(matrix.host, 'darwin-') && 'shared-mac' || matrix.host }}
      cancel-in-progress: false
    env:
      NYRA_CI_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Qualify G1/G2, bootstrap-built tools and assigned runtimes (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -B scripts/release_build.py
      - name: Qualify G1/G2, bootstrap-built tools and assigned runtimes (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python -B scripts/release_build.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-catalog-${{ matrix.host }}
          path: runtime-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-sdk-${{ matrix.host }}
          path: public-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: release-build-receipt-${{ matrix.host }}
          path: build-receipt.json
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: private-qualification-${{ matrix.host }}
          path: qualification-evidence/
          retention-days: 30
      - name: Retain assembly inputs and release completed build scratch (Unix)
        if: success() && runner.os != 'Windows'
        shell: bash
        run: python3 -B scripts/retain_assembly.py
      - name: Release completed build scratch (Windows)
        if: success() && runner.os == 'Windows'
        shell: cmd
        run: python -B scripts/retain_assembly.py
  assemble:
    name: Assemble sealed publication bundle
    needs: native
    runs-on: [self-hosted, macOS, ARM64, nyra-sdk, nyra-macos-arm64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: runtime-catalog-*
          path: catalog-input/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: public-sdk-*
          path: publish-input/
          merge-multiple: true
      - name: Assemble separate runtime bundles and seal exact inventories
        run: python3 -B scripts/release_package.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qualified-release
          path: publish-input/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  publish:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: qualified-release
          path: publish-input/
      - name: Verify and optionally publish the same accepted bytes
        env:
          SDK_RELEASE_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN }}
          PUBLISH_ACCEPTED: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          args=()
          if [ "$PUBLISH_ACCEPTED" = "true" ]; then args+=(--publish); fi
          python3 -B scripts/publish_bundle.py --directory publish-input --tag "$NYRA_CI_RELEASE_TAG" --qualification-run "$GITHUB_RUN_ID" "${args[@]}"
