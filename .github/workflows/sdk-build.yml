name: Build private SDK candidates
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Trusted private source branch, tag, or commit
        type: string
        default: main
        required: true
      full_regression:
        description: Run full regression per generation and G3 package/compiler units
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: sdk-source-build
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: darwin-arm64
            labels: [self-hosted, macOS, ARM64, nyra-sdk]
          - host: linux-x86_64
            labels: [self-hosted, Linux, X64, nyra-sdk]
          - host: windows-x86_64
            labels: [self-hosted, Windows, X64, nyra-sdk]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build private SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          NYRA_CI_SOURCE_REF: ${{ inputs.source_ref }}
          NYRA_CI_FULL_REGRESSION: ${{ inputs.full_regression }}
          NYRA_CI_HOST: ${{ matrix.host }}
        run: python3 -B scripts/build_sdk.py
      - name: Build private SDK (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          NYRA_CI_SOURCE_REF: ${{ inputs.source_ref }}
          NYRA_CI_FULL_REGRESSION: ${{ inputs.full_regression }}
          NYRA_CI_HOST: ${{ matrix.host }}
        run: python -B scripts/build_sdk.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: build-receipt-${{ matrix.host }}
          path: build-receipt.json
          retention-days: 3
