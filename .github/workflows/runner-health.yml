name: Runner health
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    name: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-arm64
            labels: [self-hosted, macOS, ARM64, nyra-sdk]
          - host: linux-x64
            labels: [self-hosted, Linux, X64, nyra-sdk]
          - host: windows-x64
            labels: [self-hosted, Windows, X64, nyra-sdk]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check native tools and private-source connectivity (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -B scripts/health.py
      - name: Check native tools and private-source connectivity (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: python -B scripts/health.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: runner-health-${{ matrix.host }}
          path: health.json
          retention-days: 3
